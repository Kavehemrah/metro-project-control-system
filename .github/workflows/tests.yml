name: Python tests

on:
  push:
    branches:
      - kavehemrah-metro-control-fix
      - feature/schedule-finance-resource-forecast
      - feature/actual-finance-eac
      - feature/activity-cost-resource-planning
  pull_request:
    branches:
      - main
      - feature/schedule-finance-resource-forecast
      - feature/actual-finance-eac

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt runtime libraries for headless UI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q
